<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Delegation Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Task Manager</h1>

        <!-- Add Task -->
        <form id="taskForm">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
                autocomplete="off"
            >

            <button type="submit">
                Add Task
            </button>

        </form>


        <!-- Task List -->
        <div class="task-container">

            <div class="task-header">
                <h2>My Tasks</h2>

                <span id="taskCount">
                    0 Tasks
                </span>
            </div>

            <ul id="taskList">

                <!-- Tasks will be added using JavaScript -->

            </ul>

            <p id="emptyMessage">
                No tasks yet. Add your first task!
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
