<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Mini Project</title>

    <link rel="stylesheet" href="card2.css">
</head>

<body>

    <header class="sticky-header">
        <h1>My Profile</h1>
    </header>

    <section class="profile-card">

        <div class="badge">⭐</div>

        <img src="photo.jpg" alt="Profile" class="profile-img">

        <h2 class="name">Rohit</h2>

        <p class="bio">
            Front-end Developer with 5+ Years of experience building user friendly
            tools. Also experienced in backend and AI Engineering.
        </p>

        <div class="stats">

            <div class="stat">
                <h3>130</h3>
                <p>Projects</p>
            </div>

            <div class="stat">
                <h3>85+</h3>
                <p>Clients</p>
            </div>

            <div class="stat">
                <h3>10+</h3>
                <p>Awards</p>
            </div>

        </div>

        <button class="contact-btn">Contact Me</button>

    </section>

</body>
</html>
