<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Instagram-inspired profile card built with HTML and CSS">

    <title>Instagram Profile Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="card">

        <img src="profile.jpg" alt="Rohit's profile photo" class="profile-image">

        <h1>Rohit</h1>

        <p class="username">@rohit_codes</p>

        <p class="bio">
            💻 CSE Student <br>
            🚀 Learning Web Development
        </p>

        <section class="stats" aria-label="Profile statistics">

            <div class="stat">
                <h2>120</h2>
                <p>Posts</p>
            </div>

            <div class="stat">
                <h2>8.5K</h2>
                <p>Followers</p>
            </div>

            <div class="stat">
                <h2>350</h2>
                <p>Following</p>
            </div>

        </section>

        <button type="button" class="follow-button">Follow</button>

    </main>

</body>
</html>
